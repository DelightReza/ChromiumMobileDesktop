name: Fetch Latest Chromium APK

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows manual trigger via the GitHub Actions tab

jobs:
  check-download-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update the release and upload assets

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Fetcher Script
      run: python get_links.py

    - name: Parse Script Results
      id: parse_vars
      run: |
        while IFS= read -r line; do
          echo "$line" >> $GITHUB_ENV
        done < latest_chromium_links.txt

    - name: Check Against Existing Release Version
      id: check_version
      run: |
        # Fetch the current release body text from GitHub API to find what build is currently live
        RELEASE_BODY=$(curl -s https://github.com{{ github.repository }}/releases/tags/latest | jq -r '.body' || echo "")
        
        # If the current build number is already mentioned in the release body, skip the run
        if [[ "$RELEASE_BODY" == *"${{ env.BUILD_VERSION }}"* ]]; then
          echo "SKIP_RUN=true" >> $GITHUB_ENV
          echo "⏩ Build ${{ env.BUILD_VERSION }} is already live. Skipping download."
        else
          echo "SKIP_RUN=false" >> $GITHUB_ENV
          echo "🆕 New build ${{ env.BUILD_VERSION }} detected!"
        fi

    - name: Download Archive
      if: env.SKIP_RUN == 'false'
      run: |
        echo "📥 Downloading ${{ env.DOWNLOAD_URL }}..."
        curl -L -o chromium-desktop.zip "${{ env.DOWNLOAD_URL }}"

    - name: Unzip and Extract APK
      if: env.SKIP_RUN == 'false'
      run: |
        echo "📂 Extracting ChromePublic.apk..."
        unzip -j chromium-desktop.zip "chrome-android-desktop/apks/ChromePublic.apk" -d .
        mv ChromePublic.apk ChromiumMobileDesktop-Latest.apk
        echo "✅ APK extracted successfully!"

    - name: Update Permanent GitHub Release
      if: env.SKIP_RUN == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Chromium Desktop Android (Latest Build)
        body: |
          ### 📱 Chrome Extension-Ready Mobile Build (Updated Daily)
          
          This release is automatically updated with the newest working build. No commits are pushed to the repository code history.
          
          * **Current Build Revision:** ${{ env.BUILD_VERSION }}
          * **Direct Source Archive:** ${{ env.DOWNLOAD_URL }}
          * **Web Directory:** ${{ env.WEB_URL }}
          
          ℹ️ _Download the **ChromiumMobileDesktop-Latest.apk** asset attached below to sideload it directly onto your Android device._
        files: |
          ChromiumMobileDesktop-Latest.apk
        draft: false
        prerelease: false
        overwrite: true # Replaces the old APK asset with the new one seamlessly
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
