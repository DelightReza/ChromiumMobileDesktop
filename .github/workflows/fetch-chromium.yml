name: Fetch Latest Chromium APK

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-download-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Fetcher Script
        run: python get_links.py

      - name: Check Against Existing Release Version
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the existing release description, if the release exists.
          RELEASE_BODY=$(gh release view latest --json body --jq '.body' 2>/dev/null || true)

          if [[ "$RELEASE_BODY" == *"${{ env.BUILD_VERSION }}"* ]]; then
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
            echo "⏩ Build ${{ env.BUILD_VERSION }} is already live. Skipping download."
          else
            echo "SKIP_RUN=false" >> "$GITHUB_ENV"
            echo "🆕 New build ${{ env.BUILD_VERSION }} detected!"
          fi

      - name: Download Archive
        if: env.SKIP_RUN == 'false'
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --output chromium-desktop.zip \
            "${{ env.DOWNLOAD_URL }}"

      - name: Unzip and Extract APK
        if: env.SKIP_RUN == 'false'
        run: |
          unzip -j chromium-desktop.zip \
            "chrome-android-desktop/apks/ChromePublic.apk" \
            -d .

          mv ChromePublic.apk ChromiumMobileDesktop-Latest.apk

      - name: Delete Existing GitHub Release Completely
        if: env.SKIP_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the release, its assets, and its latest tag.
          if gh release view latest >/dev/null 2>&1; then
            echo "🗑️ Deleting existing latest release and tag..."
            gh release delete latest --yes --cleanup-tag
          else
            echo "ℹ️ No existing latest release found."

            # Remove a dangling latest tag if it exists without a release.
            if git ls-remote --exit-code --tags origin refs/tags/latest >/dev/null 2>&1; then
              echo "🗑️ Deleting dangling latest tag..."
              git push origin --delete refs/tags/latest
            fi
          fi

      - name: Create GitHub Release
        if: env.SKIP_RUN == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chromium Desktop Android
          body: |
            ### 📱 Chrome Extension-Ready Mobile Build

            * **Current Build Revision:** ${{ env.BUILD_VERSION }}
            * **Direct Source Archive:** ${{ env.DOWNLOAD_URL }}
            * **Web Directory:** ${{ env.WEB_URL }}

            ℹ️ _Download the **ChromiumMobileDesktop-Latest.apk** asset attached below to sideload it directly onto your Android device._
          files: |
            ChromiumMobileDesktop-Latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
